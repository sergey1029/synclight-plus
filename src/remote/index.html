<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws: http:; img-src 'self' data:" />
    <title>SyncLight Plus</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <section id="pair" hidden>
      <img src="/icon.png" class="pair-logo" alt="" />
      <h1>SyncLight Plus</h1>
      <p>Введите PIN-код, который показан на компьютере:<br /><small>окно SyncLight Plus → вкладка «Телефон»</small></p>
      <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="••••" />
      <p class="error" id="pairError"></p>
    </section>

    <section id="app" hidden>
      <header>
        <div class="brand"><img src="/icon.png" alt="" />SyncLight Plus</div>
        <span class="dot" id="dot"></span>
        <button class="icon" id="fullscreen" title="На весь экран">⛶</button>
        <button class="power" id="power" aria-label="Подсветка"><span></span></button>
      </header>

      <div class="offline" id="offline" hidden>Нет связи с компьютером — переподключаюсь…</div>
      <div class="note" id="profile" hidden></div>

      <canvas id="preview"></canvas>

      <div class="block">
        <div class="label"><span>Яркость</span><b id="brightnessValue"></b></div>
        <input type="range" id="brightness" min="5" max="100" step="1" />
      </div>

      <nav class="modes" id="modes"></nav>
      <div id="modePanel"></div>
    </section>

    <script src="/presets.js"></script>
    <script src="/ambilight.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
